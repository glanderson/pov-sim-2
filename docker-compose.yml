services:
  alloy:
    image: grafana/alloy:latest
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    environment:
      CLOUD_OTLP_ENDPOINT: ${CLOUD_OTLP_ENDPOINT}
      CLOUD_OTLP_USERNAME: ${CLOUD_OTLP_USERNAME}
      CLOUD_OTLP_PASSWORD: ${CLOUD_OTLP_PASSWORD}
    ports:
      - "12345:12345"
    profiles: [backends]
  beyla:
    image: grafana/beyla:latest
    pid: host
    privileged: true
    volumes:
      - ./beyla/beyla-config.yml:/etc/beyla/config.yml:ro
    environment:
      BEYLA_CONFIG_PATH: /etc/beyla/config.yml
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      BEYLA_OTEL_METRIC_FEATURES: application,application_span,application_service_graph
      DEPLOYMENT_ENVIRONMENT: pov-sim
    depends_on: [alloy, airlines, flights]
    profiles: [backends]
  airlines:
    build: 
      context: ./airlines
    ports:
      - "8080:8080"
    profiles: [backends]
  flights:
    build: 
      context: ./flights
    ports:
      - "5001:5001"
    profiles: [backends]
  frontend:
    build: 
      context: ./frontend
    ports:
      - "3000:3000"
    profiles: [ui]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment: 
      REACT_APP_AIRLINES_API_URL: ${REACT_APP_AIRLINES_API_URL}
      REACT_APP_FLIGHTS_API_URL: ${REACT_APP_FLIGHTS_API_URL}