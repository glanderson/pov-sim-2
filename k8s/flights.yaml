apiVersion: apps/v1
kind: Deployment
metadata:
  name: flights
  labels:
    app: flights
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flights
  template:
    metadata:
      labels:
        app: flights
    spec:
      containers:
        - name: flights
          image: flights:local
          imagePullPolicy: Never
          ports:
            - containerPort: 5001
          env:
            - name: OTEL_SERVICE_NAME
              value: flights
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=pov-sim,deployment.environment=k8s,service.version=1.0.0
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://grafana-cloud-otel-receiver.test-pov.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED
              value: "true"
            - name: PYROSCOPE_APPLICATION_NAME
              value: flights
            - name: PYROSCOPE_SERVER_ADDRESS
              valueFrom:
                secretKeyRef: {name: pyroscope, key: PYROSCOPE_SERVER_ADDRESS}
            - name: PYROSCOPE_BASIC_AUTH_USER
              valueFrom:
                secretKeyRef: {name: pyroscope, key: PYROSCOPE_BASIC_AUTH_USER}
            - name: PYROSCOPE_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef: {name: pyroscope, key: PYROSCOPE_BASIC_AUTH_PASSWORD}
          readinessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: flights
spec:
  selector:
    app: flights
  ports:
    - port: 5001
      targetPort: 5001
