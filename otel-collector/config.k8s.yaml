receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Adds k8s.pod.name, k8s.namespace.name etc. so Application Observability links to the Kubernetes app
  k8sattributes:
    auth_type: serviceAccount
    passthrough: false
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.ip
      - sources:
          - from: connection
    extract:
      metadata:
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.namespace.name
        - k8s.node.name
        - k8s.deployment.name
  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: [os]
  batch: {}

extensions:
  basicauth/grafana_cloud:
    client_auth:
      username: ${env:CLOUD_OTLP_USERNAME}
      password: ${env:CLOUD_OTLP_PASSWORD}

exporters:
  otlphttp/grafana_cloud:
    endpoint: ${env:CLOUD_OTLP_ENDPOINT}
    auth:
      authenticator: basicauth/grafana_cloud

service:
  extensions: [basicauth/grafana_cloud]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [k8sattributes, resourcedetection, batch]
      exporters: [otlphttp/grafana_cloud]
    logs:
      receivers: [otlp]
      processors: [k8sattributes, resourcedetection, batch]
      exporters: [otlphttp/grafana_cloud]
    traces:
      receivers: [otlp]
      processors: [k8sattributes, resourcedetection, batch]
      exporters: [otlphttp/grafana_cloud]
